apiVersion: v1
kind: ConfigMap

metadata:
  name: prometheus-config
  namespace: nexusops

data:
  prometheus.yml: |

    global:
      scrape_interval: 15s

    scrape_configs:

      - job_name: 'prometheus'

        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'backend'
        static_configs:
          - targets: ['backend-service:5000']

      - job_name: 'grafana'
        static_configs:
          - targets: ['grafana-service:3000']

      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.kube-system.svc.cluster.local:8080']